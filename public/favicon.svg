<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="lionGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#764ba2;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background Circle -->
  <circle cx="256" cy="256" r="256" fill="url(#lionGrad)"/>
  
  <!-- Lion Head (simplified geometric design) -->
  <g transform="translate(256, 256)">
    <!-- Mane (outer layer) -->
    <circle cx="0" cy="0" r="140" fill="#5a67d8" opacity="0.3"/>
    
    <!-- Mane points -->
    <circle cx="0" cy="-150" r="25" fill="#5a67d8" opacity="0.4"/>
    <circle cx="106" cy="-106" r="25" fill="#5a67d8" opacity="0.4"/>
    <circle cx="150" cy="0" r="25" fill="#5a67d8" opacity="0.4"/>
    <circle cx="106" cy="106" r="25" fill="#5a67d8" opacity="0.4"/>
    <circle cx="0" cy="150" r="25" fill="#5a67d8" opacity="0.4"/>
    <circle cx="-106" cy="106" r="25" fill="#5a67d8" opacity="0.4"/>
    <circle cx="-150" cy="0" r="25" fill="#5a67d8" opacity="0.4"/>
    <circle cx="-106" cy="-106" r="25" fill="#5a67d8" opacity="0.4"/>
    
    <!-- Face -->
    <circle cx="0" cy="0" r="100" fill="#f7fafc"/>
    
    <!-- Eyes -->
    <ellipse cx="-35" cy="-20" rx="12" ry="18" fill="#2d3748"/>
    <ellipse cx="35" cy="-20" rx="12" ry="18" fill="#2d3748"/>
    
    <!-- Eye shine -->
    <ellipse cx="-32" cy="-25" rx="5" ry="7" fill="#ffffff"/>
    <ellipse cx="38" cy="-25" rx="5" ry="7" fill="#ffffff"/>
    
    <!-- Nose -->
    <path d="M -15,10 Q 0,20 15,10 Q 0,25 -15,10" fill="#4a5568"/>
    
    <!-- Mouth -->
    <path d="M -30,40 Q 0,60 30,40" stroke="#4a5568" stroke-width="4" fill="none" stroke-linecap="round"/>
    
    <!-- Whiskers left -->
    <line x1="-100" y1="5" x2="-60" y2="0" stroke="#2d3748" stroke-width="2" opacity="0.6"/>
    <line x1="-105" y1="20" x2="-65" y2="20" stroke="#2d3748" stroke-width="2" opacity="0.6"/>
    <line x1="-100" y1="35" x2="-60" y2="40" stroke="#2d3748" stroke-width="2" opacity="0.6"/>
    
    <!-- Whiskers right -->
    <line x1="100" y1="5" x2="60" y2="0" stroke="#2d3748" stroke-width="2" opacity="0.6"/>
    <line x1="105" y1="20" x2="65" y2="20" stroke="#2d3748" stroke-width="2" opacity="0.6"/>
    <line x1="100" y1="35" x2="60" y2="40" stroke="#2d3748" stroke-width="2" opacity="0.6"/>
    
    <!-- Letter "W" integrated into design -->
    <text x="0" y="90" font-family="Arial, sans-serif" font-size="50" font-weight="bold" fill="#667eea" text-anchor="middle" opacity="0.3">W</text>
  </g>
</svg>