<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <linearGradient id="smallLionGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#764ba2;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="32" height="32" rx="6" fill="url(#smallLionGrad)"/>
  
  <!-- Simplified Lion Face -->
  <g transform="translate(16, 16)">
    <!-- Face -->
    <circle cx="0" cy="0" r="7" fill="#f7fafc"/>
    
    <!-- Eyes -->
    <circle cx="-2.5" cy="-1.5" r="1" fill="#2d3748"/>
    <circle cx="2.5" cy="-1.5" r="1" fill="#2d3748"/>
    
    <!-- Nose -->
    <circle cx="0" cy="1" r="0.8" fill="#4a5568"/>
    
    <!-- Mouth -->
    <path d="M -2,3 Q 0,4 2,3" stroke="#4a5568" stroke-width="0.5" fill="none" stroke-linecap="round"/>
    
    <!-- Mane effect -->
    <circle cx="-8" cy="-8" r="2" fill="#5a67d8" opacity="0.5"/>
    <circle cx="8" cy="-8" r="2" fill="#5a67d8" opacity="0.5"/>
    <circle cx="-8" cy="8" r="2" fill="#5a67d8" opacity="0.5"/>
    <circle cx="8" cy="8" r="2" fill="#5a67d8" opacity="0.5"/>
  </g>
</svg>