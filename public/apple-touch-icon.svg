<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 180">
  <defs>
    <linearGradient id="appleLionGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#764ba2;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background with rounded corners for iOS -->
  <rect width="180" height="180" rx="40" fill="url(#appleLionGrad)"/>
  
  <!-- Lion Head -->
  <g transform="translate(90, 90)">
    <!-- Mane -->
    <circle cx="0" cy="0" r="50" fill="#5a67d8" opacity="0.3"/>
    
    <!-- Mane points -->
    <circle cx="0" cy="-53" r="9" fill="#5a67d8" opacity="0.4"/>
    <circle cx="37" cy="-37" r="9" fill="#5a67d8" opacity="0.4"/>
    <circle cx="53" cy="0" r="9" fill="#5a67d8" opacity="0.4"/>
    <circle cx="37" cy="37" r="9" fill="#5a67d8" opacity="0.4"/>
    <circle cx="0" cy="53" r="9" fill="#5a67d8" opacity="0.4"/>
    <circle cx="-37" cy="37" r="9" fill="#5a67d8" opacity="0.4"/>
    <circle cx="-53" cy="0" r="9" fill="#5a67d8" opacity="0.4"/>
    <circle cx="-37" cy="-37" r="9" fill="#5a67d8" opacity="0.4"/>
    
    <!-- Face -->
    <circle cx="0" cy="0" r="35" fill="#f7fafc"/>
    
    <!-- Eyes -->
    <ellipse cx="-12" cy="-7" rx="4" ry="6" fill="#2d3748"/>
    <ellipse cx="12" cy="-7" rx="4" ry="6" fill="#2d3748"/>
    
    <!-- Eye shine -->
    <ellipse cx="-11" cy="-9" rx="2" ry="3" fill="#ffffff"/>
    <ellipse cx="13" cy="-9" rx="2" ry="3" fill="#ffffff"/>
    
    <!-- Nose -->
    <path d="M -5,4 Q 0,7 5,4 Q 0,9 -5,4" fill="#4a5568"/>
    
    <!-- Mouth -->
    <path d="M -10,14 Q 0,21 10,14" stroke="#4a5568" stroke-width="1.5" fill="none" stroke-linecap="round"/>
    
    <!-- Whiskers -->
    <line x1="-35" y1="2" x2="-21" y2="0" stroke="#2d3748" stroke-width="0.7" opacity="0.6"/>
    <line x1="-37" y1="7" x2="-23" y2="7" stroke="#2d3748" stroke-width="0.7" opacity="0.6"/>
    <line x1="-35" y1="12" x2="-21" y2="14" stroke="#2d3748" stroke-width="0.7" opacity="0.6"/>
    
    <line x1="35" y1="2" x2="21" y2="0" stroke="#2d3748" stroke-width="0.7" opacity="0.6"/>
    <line x1="37" y1="7" x2="23" y2="7" stroke="#2d3748" stroke-width="0.7" opacity="0.6"/>
    <line x1="35" y1="12" x2="21" y2="14" stroke="#2d3748" stroke-width="0.7" opacity="0.6"/>
  </g>
</svg>