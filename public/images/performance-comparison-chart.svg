<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-labelledby="comparison-title comparison-desc">
  <title id="comparison-title">최적화 전후 성능 비교</title>
  <desc id="comparison-desc">React 최적화 적용 전후의 렌더링 성능을 비교하는 막대 그래프</desc>
  
  <defs>
    <linearGradient id="redGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#fc8181;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e53e3e;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#68d391;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#38a169;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="800" height="500" fill="#ffffff"/>
  
  <!-- Title -->
  <text x="400" y="40" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#2d3748" text-anchor="middle">
    최적화 전후 성능 비교
  </text>
  
  <!-- Y-axis label -->
  <text x="30" y="250" font-family="Arial, sans-serif" font-size="12" fill="#4a5568" text-anchor="middle" transform="rotate(-90 30 250)">
    렌더링 시간 (ms)
  </text>
  
  <!-- Y-axis -->
  <line x1="80" y1="100" x2="80" y2="420" stroke="#cbd5e0" stroke-width="2"/>
  
  <!-- X-axis -->
  <line x1="80" y1="420" x2="750" y2="420" stroke="#cbd5e0" stroke-width="2"/>
  
  <!-- Y-axis ticks and labels -->
  <line x1="75" y1="100" x2="80" y2="100" stroke="#cbd5e0" stroke-width="2"/>
  <text x="65" y="105" font-family="Arial, sans-serif" font-size="11" fill="#718096" text-anchor="end">200</text>
  
  <line x1="75" y1="180" x2="80" y2="180" stroke="#cbd5e0" stroke-width="2"/>
  <text x="65" y="185" font-family="Arial, sans-serif" font-size="11" fill="#718096" text-anchor="end">150</text>
  
  <line x1="75" y1="260" x2="80" y2="260" stroke="#cbd5e0" stroke-width="2"/>
  <text x="65" y="265" font-family="Arial, sans-serif" font-size="11" fill="#718096" text-anchor="end">100</text>
  
  <line x1="75" y1="340" x2="80" y2="340" stroke="#cbd5e0" stroke-width="2"/>
  <text x="65" y="345" font-family="Arial, sans-serif" font-size="11" fill="#718096" text-anchor="end">50</text>
  
  <line x1="75" y1="420" x2="80" y2="420" stroke="#cbd5e0" stroke-width="2"/>
  <text x="65" y="425" font-family="Arial, sans-serif" font-size="11" fill="#718096" text-anchor="end">0</text>
  
  <!-- Bars Group 1: 초기 렌더링 -->
  <text x="220" y="460" font-family="Arial, sans-serif" font-size="13" fill="#2d3748" text-anchor="middle" font-weight="500">
    초기 렌더링
  </text>
  
  <!-- Before optimization -->
  <rect x="140" y="160" width="80" height="260" rx="4" fill="url(#redGrad)" filter="url(#shadow)"/>
  <text x="180" y="145" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#e53e3e" text-anchor="middle">
    162ms
  </text>
  <text x="180" y="440" font-family="Arial, sans-serif" font-size="11" fill="#4a5568" text-anchor="middle">
    최적화 전
  </text>
  
  <!-- After optimization -->
  <rect x="240" y="240" width="80" height="180" rx="4" fill="url(#greenGrad)" filter="url(#shadow)"/>
  <text x="280" y="225" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#38a169" text-anchor="middle">
    112ms
  </text>
  <text x="280" y="440" font-family="Arial, sans-serif" font-size="11" fill="#4a5568" text-anchor="middle">
    최적화 후
  </text>
  
  <!-- Improvement indicator 1 -->
  <text x="210" y="200" font-family="Arial, sans-serif" font-size="12" fill="#38a169" text-anchor="middle" font-weight="bold">
    ▼ 31%
  </text>
  
  <!-- Bars Group 2: 재렌더링 -->
  <text x="480" y="460" font-family="Arial, sans-serif" font-size="13" fill="#2d3748" text-anchor="middle" font-weight="500">
    재렌더링 (props 변경)
  </text>
  
  <!-- Before optimization -->
  <rect x="400" y="100" width="80" height="320" rx="4" fill="url(#redGrad)" filter="url(#shadow)"/>
  <text x="440" y="85" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#e53e3e" text-anchor="middle">
    198ms
  </text>
  <text x="440" y="440" font-family="Arial, sans-serif" font-size="11" fill="#4a5568" text-anchor="middle">
    최적화 전
  </text>
  
  <!-- After optimization -->
  <rect x="500" y="360" width="80" height="60" rx="4" fill="url(#greenGrad)" filter="url(#shadow)"/>
  <text x="540" y="345" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#38a169" text-anchor="middle">
    37ms
  </text>
  <text x="540" y="440" font-family="Arial, sans-serif" font-size="11" fill="#4a5568" text-anchor="middle">
    최적화 후
  </text>
  
  <!-- Improvement indicator 2 -->
  <text x="470" y="230" font-family="Arial, sans-serif" font-size="12" fill="#38a169" text-anchor="middle" font-weight="bold">
    ▼ 81%
  </text>
  
  <!-- Bars Group 3: 리스트 렌더링 -->
  <text x="680" y="460" font-family="Arial, sans-serif" font-size="13" fill="#2d3748" text-anchor="middle" font-weight="500">
    리스트 렌더링
  </text>
  
  <!-- Before optimization -->
  <rect x="610" y="120" width="80" height="300" rx="4" fill="url(#redGrad)" filter="url(#shadow)"/>
  <text x="650" y="105" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#e53e3e" text-anchor="middle">
    187ms
  </text>
  <text x="650" y="440" font-family="Arial, sans-serif" font-size="11" fill="#4a5568" text-anchor="middle">
    최적화 전
  </text>
  
  <!-- After optimization -->
  <rect x="710" y="320" width="80" height="100" rx="4" fill="url(#greenGrad)" filter="url(#shadow)"/>
  <text x="750" y="305" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#38a169" text-anchor="middle">
    62ms
  </text>
  <text x="750" y="440" font-family="Arial, sans-serif" font-size="11" fill="#4a5568" text-anchor="middle">
    최적화 후
  </text>
  
  <!-- Improvement indicator 3 -->
  <text x="680" y="220" font-family="Arial, sans-serif" font-size="12" fill="#38a169" text-anchor="middle" font-weight="bold">
    ▼ 67%
  </text>
  
  <!-- Legend -->
  <rect x="580" y="20" width="15" height="15" rx="2" fill="url(#redGrad)"/>
  <text x="600" y="32" font-family="Arial, sans-serif" font-size="12" fill="#4a5568">최적화 전</text>
  
  <rect x="680" y="20" width="15" height="15" rx="2" fill="url(#greenGrad)"/>
  <text x="700" y="32" font-family="Arial, sans-serif" font-size="12" fill="#4a5568">최적화 후</text>
</svg>